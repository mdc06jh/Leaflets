<style>
  /* ═══════════════════════════════════════════════════════════════════
     Bristol NHS Foundation Trust design system.
     Tokens lifted from the design-system project: colours from the Trust
     theme (NHS Identity palette), Arial standing in for Frutiger, the
     round2DiagRect signature frame, and the flat, shadow-light surfaces.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    /* Core palette */
    --bft-dark-blue: #003087;
    --bft-blue: #005EB8;
    --bft-aqua-green: #00A499;
    --bft-purple: #662982;
    --bft-pale-blue: #BDDFFF;
    --bft-white: #FFFFFF;
    --bft-grey-light: #D8D8D8;
    --bft-grey-95: #F2F2F2;
    --bft-grey-30: #4D4D4D;
    --bft-black: #000000;

    /* Semantic aliases used through this page */
    --brand: var(--bft-dark-blue);
    --brand-ink: var(--bft-white);
    --accent: var(--bft-blue);
    --bg: var(--bft-grey-95);
    --surface: var(--bft-white);
    --ink: var(--bft-black);
    --ink-soft: var(--bft-grey-30);
    --line: var(--bft-grey-light);
    --danger: #A4001B;

    --warn-bg: #FFF6E5;
    --warn-line: #E0B25E;
    --warn-ink: #5C3D00;

    /* Type */
    --font-core: Arial, "Helvetica Neue", Helvetica, sans-serif;
    --text-web-h1: 40px;
    --text-web-h2: 28px;
    --text-web-h3: 22px;
    --text-web-body: 18px;
    --text-web-sm: 15px;
    --leading-tight: 1.1;
    --leading-normal: 1.35;
    --tracking-kern: 0.01em;

    /* Shape — round2DiagRect is the Trust's signature frame */
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    --radius-diag-tl-br: 48px 0 48px 0;
    --radius-capsule: 294px;

    /* Elevation */
    --shadow-raised: 0 1px 2px rgba(0,48,135,0.08);
    --shadow-card: 0 2px 8px rgba(0,48,135,0.10);
    --focus-ring: 0 0 0 3px #FFEB3B, 0 0 0 6px var(--bft-dark-blue);

    --gradient-bar: linear-gradient(90deg, var(--bft-aqua-green) 0%, var(--bft-blue) 50%, var(--bft-purple) 100%);

    --tap: 56px;
  }

  /* The Trust brand is defined light-only, so the page stays light whatever
     the phone is set to. The QR itself must be black on white regardless. */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-core);
    font-size: var(--text-web-body);
    line-height: var(--leading-normal);
    -webkit-text-size-adjust: 100%;
    padding-bottom: env(safe-area-inset-bottom);
  }

  :focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* ── Header, with the signature gradient rule beneath ────────── */
  header.bar {
    background: var(--brand);
    color: var(--brand-ink);
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 4px solid transparent;
    border-image: var(--gradient-bar) 1;
  }
  header.bar h1 {
    font-size: var(--text-web-h3); margin: 0; font-weight: 700;
    flex: 1; min-width: 0; letter-spacing: var(--tracking-kern);
    line-height: var(--leading-tight);
  }
  header.bar .crumb {
    font-size: var(--text-web-sm); opacity: .85; display: block; font-weight: 400;
    margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0;
  }
  .backbtn {
    background: rgba(255,255,255,.16); color: inherit; border: 0;
    font: inherit; font-size: var(--text-web-sm); border-radius: var(--radius-md);
    min-height: 44px; padding: 0 16px; cursor: pointer; flex: none; font-weight: 700;
  }
  .backbtn:active { background: rgba(255,255,255,.32); }

  main { padding: 20px 16px 28px; max-width: 720px; margin: 0 auto; }

  /* ── Menu ────────────────────────────────────────────────────── */
  ul.menu { list-style: none; margin: 0; padding: 0; }
  ul.menu li { margin: 0 0 10px; }
  .item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: var(--tap); padding: 14px 16px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line);
    border-left: 4px solid var(--bft-blue);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-raised);
    font: inherit; text-align: left; cursor: pointer;
  }
  .item:active { background: var(--bft-pale-blue); }
  .item .label { flex: 1; font-weight: 700; color: var(--bft-dark-blue); }
  .item .chev { color: var(--accent); font-size: 22px; flex: none; font-weight: 700; }
  .item .kind {
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--bft-white); background: var(--accent); flex: none;
    padding: 3px 9px; border-radius: var(--radius-sm); font-weight: 700;
  }

  /* ── QR screen ───────────────────────────────────────────────── */
  .qrwrap { text-align: center; }
  .qrcard {
    background: #ffffff;
    border-radius: var(--radius-diag-tl-br);   /* Trust signature frame */
    padding: 24px;
    display: inline-block;
    border: 2px solid var(--bft-dark-blue);
    box-shadow: var(--shadow-card);
  }
  .qrcard canvas { display: block; width: 100%; height: auto; max-width: 340px; image-rendering: pixelated; }
  .qrtitle {
    font-size: var(--text-web-h2); font-weight: 700; margin: 4px 0 6px;
    color: var(--bft-dark-blue); line-height: var(--leading-tight);
    letter-spacing: var(--tracking-kern);
  }
  .qrhint { color: var(--ink-soft); font-size: var(--text-web-sm); margin: 0 0 20px; }
  .urltext {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: var(--ink-soft); word-break: break-all;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 11px 13px; margin: 20px 0 0; text-align: left;
  }

  /* ── Buttons ─────────────────────────────────────────────────── */
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; justify-content: center; }
  button.act, a.act {
    min-height: 48px; padding: 0 20px; border-radius: var(--radius-md);
    border: 2px solid var(--bft-dark-blue); background: var(--surface);
    color: var(--bft-dark-blue);
    font: inherit; font-size: var(--text-web-sm); font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; text-decoration: none;
  }
  button.act.primary, a.act.primary {
    background: var(--bft-dark-blue); border-color: var(--bft-dark-blue); color: #fff;
  }
  button.act:active, a.act:active { background: var(--bft-pale-blue); }
  button.act.primary:active, a.act.primary:active { background: #00256A; }
  button.act.danger { color: var(--danger); border-color: var(--danger); }

  /* ── Notices ─────────────────────────────────────────────────── */
  .note {
    background: var(--warn-bg); border: 1px solid var(--warn-line);
    border-left: 4px solid var(--warn-line); color: var(--warn-ink);
    border-radius: var(--radius-md); padding: 14px 16px;
    font-size: var(--text-web-sm); margin: 20px 0 0; text-align: left;
  }
  .note strong { display: block; margin-bottom: 4px; font-weight: 700; }

  .foot { margin-top: 28px; padding-top: 20px; border-top: 2px solid transparent;
          border-image: var(--gradient-bar) 1; }
  .foot .btnrow { justify-content: flex-start; }
  .foot p { color: var(--ink-soft); font-size: var(--text-web-sm); margin: 16px 0 0; }

  /* ── Other languages ─────────────────────────────────────────── */
  .langnow { margin: 0 0 12px; font-size: var(--text-web-sm); color: var(--ink-soft); }
  .langpill {
    display: inline-block; background: var(--bft-aqua-green); color: #fff;
    border-radius: var(--radius-capsule); padding: 4px 14px;
    font-size: var(--text-web-sm); font-weight: 700; margin-right: 8px;
  }
  .langbox {
    margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line);
    text-align: left;
  }
  .langhead {
    font-size: var(--text-web-h3); margin: 0 0 4px; font-weight: 700;
    color: var(--bft-dark-blue);
  }
  .langsub { color: var(--ink-soft); font-size: var(--text-web-sm); margin: 0 0 14px; }
  .langlist { display: flex; flex-wrap: wrap; gap: 8px; }
  button.lang {
    min-height: 44px; padding: 0 16px; border-radius: var(--radius-capsule);
    border: 1px solid var(--bft-blue); background: var(--surface); color: var(--bft-dark-blue);
    font: inherit; font-size: var(--text-web-sm); font-weight: 700; cursor: pointer;
  }
  button.lang:active { background: var(--bft-pale-blue); }
  button.lang.on {
    background: var(--bft-blue); border-color: var(--bft-blue);
    color: #fff;
  }

  /* ── Record of leaflets shown ────────────────────────────────── */
  .logday {
    font-size: var(--text-web-sm); font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--bft-dark-blue);
    margin: 22px 0 6px; padding-bottom: 5px;
    border-bottom: 2px solid var(--bft-pale-blue);
  }
  .logday:first-of-type { margin-top: 4px; }
  .log { list-style: none; margin: 0; padding: 0; font-size: var(--text-web-body); }
  .log li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 14px; }
  .log li .t { color: var(--ink-soft); font-variant-numeric: tabular-nums; flex: none; font-weight: 700; }
  .empty { color: var(--ink-soft); font-size: var(--text-web-body); }
</style>
</head>
<body>

<header class="bar">
  <button class="backbtn" id="back" hidden>‹ Back</button>
  <h1><span id="title">Patient information</span><span class="crumb" id="crumb"></span></h1>
</header>

<main id="app"><!-- rendered by script; emptied before export --></main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PART 1 — QR CODE GENERATOR
   Byte mode, versions 1-40, all four error-correction levels.
   Self-contained: no internet, no external library, nothing leaves the
   device. Implements ISO/IEC 18004.
   ═══════════════════════════════════════════════════════════════════════ */
var QR = (function () {
  'use strict';

  // Error-correction codewords per block, indexed [ecl][version]. ecl: 0=L 1=M 2=Q 3=H
  var ECC_PER_BLOCK = [
    [-1, 7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]
  ];
  // Number of error-correction blocks, indexed [ecl][version]
  var NUM_BLOCKS = [
    [-1,1,1,1,1,1,2,2,2,2,4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5, 5, 8, 9, 9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8, 8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]
  ];
  var FORMAT_BITS = [1, 0, 3, 2]; // L, M, Q, H

  function getBit(x, i) { return ((x >>> i) & 1) !== 0; }

  // Galois field GF(256) multiply, primitive polynomial 0x11D
  function gfMul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xFF;
  }

  function rsDivisor(degree) {
    var result = new Uint8Array(degree);
    result[degree - 1] = 1;
    var root = 1;
    for (var i = 0; i < degree; i++) {
      for (var j = 0; j < degree; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < degree) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return result;
  }

  function rsRemainder(data, divisor) {
    var result = new Uint8Array(divisor.length);
    for (var k = 0; k < data.length; k++) {
      var factor = data[k] ^ result[0];
      for (var s = 0; s < result.length - 1; s++) result[s] = result[s + 1];
      result[result.length - 1] = 0;
      for (var i = 0; i < divisor.length; i++) result[i] ^= gfMul(divisor[i], factor);
    }
    return result;
  }

  function numRawDataModules(ver) {
    var result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }

  function numDataCodewords(ver, ecl) {
    return Math.floor(numRawDataModules(ver) / 8)
         - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
  }

  function toUtf8(str) {
    var out = [];
    var esc = encodeURIComponent(str);
    for (var i = 0; i < esc.length; i++) {
      if (esc.charAt(i) === '%') { out.push(parseInt(esc.substr(i + 1, 2), 16)); i += 2; }
      else out.push(esc.charCodeAt(i));
    }
    return out;
  }

  function alignPositions(ver, size) {
    if (ver === 1) return [];
    var numAlign = Math.floor(ver / 7) + 2;
    var step = (ver === 32) ? 26 : Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
    var result = [6];
    for (var pos = size - 7; result.length < numAlign; pos -= step) result.splice(1, 0, pos);
    return result;
  }

  /** Encode `text` and return { size, modules } where modules[y][x] is true for dark. */
  function encode(text, eclName) {
    var ecl = { L: 0, M: 1, Q: 2, H: 3 }[eclName || 'M'];
    var bytes = toUtf8(text);

    // Smallest version that fits
    var ver = 0;
    for (var v = 1; v <= 40; v++) {
      var lenBits = (v <= 9) ? 8 : 16;
      var need = 4 + lenBits + bytes.length * 8;
      if (need <= numDataCodewords(v, ecl) * 8) { ver = v; break; }
    }
    if (ver === 0) throw new Error('This link is too long to fit in a QR code.');

    var size = ver * 4 + 17;
    var dataCapacityBits = numDataCodewords(ver, ecl) * 8;

    // ── Build the bit stream ──
    var bits = [];
    function append(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
    append(4, 4);                                  // byte mode
    append(bytes.length, ver <= 9 ? 8 : 16);       // character count
    for (var i = 0; i < bytes.length; i++) append(bytes[i], 8);
    append(0, Math.min(4, dataCapacityBits - bits.length));   // terminator
    append(0, (8 - bits.length % 8) % 8);                     // pad to byte
    for (var pad = 0xEC; bits.length < dataCapacityBits; pad ^= 0xEC ^ 0x11) append(pad, 8);

    var dataCodewords = new Uint8Array(bits.length / 8);
    for (var b = 0; b < bits.length; b++) dataCodewords[b >>> 3] |= bits[b] << (7 - (b & 7));

    // ── Error correction + interleave ──
    var numBlocks = NUM_BLOCKS[ecl][ver];
    var eccLen = ECC_PER_BLOCK[ecl][ver];
    var rawCodewords = Math.floor(numRawDataModules(ver) / 8);
    var numShort = numBlocks - rawCodewords % numBlocks;
    var shortLen = Math.floor(rawCodewords / numBlocks);

    var blocks = [], div = rsDivisor(eccLen);
    for (var i2 = 0, k = 0; i2 < numBlocks; i2++) {
      var datLen = shortLen - eccLen + (i2 < numShort ? 0 : 1);
      var dat = Array.prototype.slice.call(dataCodewords, k, k + datLen);
      k += datLen;
      var ecc = rsRemainder(dat, div);
      if (i2 < numShort) dat.push(0);            // placeholder, skipped on interleave
      blocks.push(dat.concat(Array.prototype.slice.call(ecc)));
    }
    var codewords = [];
    for (var i3 = 0; i3 < blocks[0].length; i3++) {
      for (var j = 0; j < blocks.length; j++) {
        if (i3 !== shortLen - eccLen || j >= numShort) codewords.push(blocks[j][i3]);
      }
    }

    // ── Draw ──
    var modules = [], isFn = [];
    for (var y = 0; y < size; y++) {
      modules.push(new Array(size).fill(false));
      isFn.push(new Array(size).fill(false));
    }
    function setFn(x, y, dark) {
      if (x < 0 || y < 0 || x >= size || y >= size) return;
      modules[y][x] = dark; isFn[y][x] = true;
    }

    // Timing patterns
    for (var t = 0; t < size; t++) { setFn(6, t, t % 2 === 0); setFn(t, 6, t % 2 === 0); }

    // Finder patterns + separators
    function finder(cx, cy) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var dist = Math.max(Math.abs(dx), Math.abs(dy));
        setFn(cx + dx, cy + dy, dist !== 2 && dist !== 4);
      }
    }
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

    // Alignment patterns
    var ap = alignPositions(ver, size), n = ap.length;
    for (var ai = 0; ai < n; ai++) for (var aj = 0; aj < n; aj++) {
      if ((ai === 0 && aj === 0) || (ai === 0 && aj === n - 1) || (ai === n - 1 && aj === 0)) continue;
      for (var dy2 = -2; dy2 <= 2; dy2++) for (var dx2 = -2; dx2 <= 2; dx2++)
        setFn(ap[aj] + dx2, ap[ai] + dy2, Math.max(Math.abs(dx2), Math.abs(dy2)) !== 1);
    }

    // Version information (version 7 and above)
    if (ver >= 7) {
      var rem = ver;
      for (var vi = 0; vi < 12; vi++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      var vbits = ver << 12 | rem;
      for (var vb = 0; vb < 18; vb++) {
        var vbit = getBit(vbits, vb);
        var va = size - 11 + vb % 3, vbb = Math.floor(vb / 3);
        setFn(va, vbb, vbit); setFn(vbb, va, vbit);
      }
    }

    function drawFormat(mask) {
      var data = FORMAT_BITS[ecl] << 3 | mask;
      var r = data;
      for (var fi = 0; fi < 10; fi++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      var fbits = ((data << 10) | r) ^ 0x5412;
      for (var i4 = 0; i4 <= 5; i4++) setFn(8, i4, getBit(fbits, i4));
      setFn(8, 7, getBit(fbits, 6));
      setFn(8, 8, getBit(fbits, 7));
      setFn(7, 8, getBit(fbits, 8));
      for (var i5 = 9; i5 < 15; i5++) setFn(14 - i5, 8, getBit(fbits, i5));
      for (var i6 = 0; i6 < 8; i6++) setFn(size - 1 - i6, 8, getBit(fbits, i6));
      for (var i7 = 8; i7 < 15; i7++) setFn(8, size - 15 + i7, getBit(fbits, i7));
      setFn(8, size - 8, true);   // always-dark module
    }
    drawFormat(0);

    // Place the codewords, zig-zagging up and down the columns
    var bi = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < size; vert++) {
        for (var jj = 0; jj < 2; jj++) {
          var x = right - jj;
          var upward = ((right + 1) & 2) === 0;
          var yy = upward ? size - 1 - vert : vert;
          if (!isFn[yy][x] && bi < codewords.length * 8) {
            modules[yy][x] = getBit(codewords[bi >>> 3], 7 - (bi & 7));
            bi++;
          }
        }
      }
    }

    function maskBit(m, x, y) {
      switch (m) {
        case 0: return (x + y) % 2 === 0;
        case 1: return y % 2 === 0;
        case 2: return x % 3 === 0;
        case 3: return (x + y) % 3 === 0;
        case 4: return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
        case 5: return (x * y) % 2 + (x * y) % 3 === 0;
        case 6: return ((x * y) % 2 + (x * y) % 3) % 2 === 0;
        case 7: return ((x + y) % 2 + (x * y) % 3) % 2 === 0;
      }
    }

      for (var y3 = 0; y3 < size; y3++) for (var x3 = 0; x3 < size; x3++)
        if (!isFn[y3][x3] && maskBit(m, x3, y3)) modules[y3][x3] = !modules[y3][x3];
    }

    // Penalty scoring, per the specification, to pick the most scannable mask
    function penalty() {
      var p = 0, x4, y4, i8;
      // Rule 1: runs of five or more same-colour modules in a row/column
      for (y4 = 0; y4 < size; y4++) {
        var runColor = modules[y4][0], runLen = 1;
        for (x4 = 1; x4 < size; x4++) {
          if (modules[y4][x4] === runColor) { runLen++; if (runLen === 5) p += 3; else if (runLen > 5) p++; }
          else { runColor = modules[y4][x4]; runLen = 1; }
        }
      }
      for (x4 = 0; x4 < size; x4++) {
        var rc = modules[0][x4], rl = 1;
        for (y4 = 1; y4 < size; y4++) {
          if (modules[y4][x4] === rc) { rl++; if (rl === 5) p += 3; else if (rl > 5) p++; }
          else { rc = modules[y4][x4]; rl = 1; }
        }
      }
      // Rule 2: 2x2 blocks of one colour
      for (y4 = 0; y4 < size - 1; y4++) for (x4 = 0; x4 < size - 1; x4++) {
        var c = modules[y4][x4];
        if (c === modules[y4][x4 + 1] && c === modules[y4 + 1][x4] && c === modules[y4 + 1][x4 + 1]) p += 3;
      }
      // Rule 3: finder-like 1:1:3:1:1 patterns
      var pat1 = [true,false,true,true,true,false,true,false,false,false,false];
      var pat2 = [false,false,false,false,true,false,true,true,true,false,true];
      function matches(get, at) {
        for (var q = 0; q < 11; q++) if (get(at + q) !== pat1[q]) break;
        if (q === 11) return true;
        for (q = 0; q < 11; q++) if (get(at + q) !== pat2[q]) return false;
        return true;
      }
      for (y4 = 0; y4 < size; y4++) for (x4 = 0; x4 <= size - 11; x4++) {
        (function (yy2, xx2) {
          if (matches(function (k2) { return modules[yy2][k2]; }, xx2)) p += 40;
        })(y4, x4);
      }
      for (x4 = 0; x4 < size; x4++) for (y4 = 0; y4 <= size - 11; y4++) {
        (function (xx2, yy2) {
          if (matches(function (k2) { return modules[k2][xx2]; }, yy2)) p += 40;
        })(x4, y4);
      }
      // Rule 4: deviation from 50% dark
      var dark = 0;
      for (y4 = 0; y4 < size; y4++) for (x4 = 0; x4 < size; x4++) if (modules[y4][x4]) dark++;
      var total = size * size;
      var k3 = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
      p += k3 * 10;
      return p;
    }

    var bestMask = 0, bestPenalty = Infinity;
    for (var m2 = 0; m2 < 8; m2++) {
      applyMask(m2); drawFormat(m2);
      var pen = penalty();
      if (pen < bestPenalty) { bestPenalty = pen; bestMask = m2; }
      applyMask(m2); // undo (XOR is its own inverse)
    }
    applyMask(bestMask); drawFormat(bestMask);

    return { size: size, modules: modules, version: ver };
  }

  /** Render onto a canvas at a whole number of pixels per module, so edges stay sharp. */
  function draw(canvas, text, opts) {
    opts = opts || {};
    var qr = encode(text, opts.ecl || 'M');
    var quiet = 4;                              // mandatory quiet zone
    var total = qr.size + quiet * 2;
    var target = opts.px || 320;
    var scale = Math.max(2, Math.floor(target / total));
    var dim = total * scale;

    canvas.width = dim;
    canvas.height = dim;
    canvas.style.maxWidth = Math.min(dim, target) + 'px';

    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, dim, dim);
    ctx.fillStyle = '#000000';
    for (var y = 0; y < qr.size; y++) for (var x = 0; x < qr.size; x++) {
      if (qr.modules[y][x]) ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
    }
    return qr;
  }

  return { encode: encode, draw: draw };
})();


/* ═══════════════════════════════════════════════════════════════════════
   PART 2 — THE APP
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var MENU   = JSON.parse(document.getElementById('menu-data').textContent);
  var CONFIG = JSON.parse(document.getElementById('config-data').textContent);

  var TX = { base: '', sets: {} };
  var txEl = document.getElementById('translations-data');
  if (txEl) { try { TX = JSON.parse(txEl.textContent); } catch (e) { /* leave empty */ } }

  /** Languages a leaflet is available in, or an empty list. */
  function languagesFor(node) {
    if (!node || !node.tx || !TX.sets[node.tx]) return [];
    return Object.keys(TX.sets[node.tx]).sort();
  }
  function translationUrl(node, language) {
    if (!node || !node.tx || !TX.sets[node.tx] || !TX.sets[node.tx][language]) return null;
    return TX.base + TX.sets[node.tx][language];
  }

  var app     = document.getElementById('app');
  var titleEl = document.getElementById('title');
  var crumbEl = document.getElementById('crumb');
  var backEl  = document.getElementById('back');

  var path = [];        // indices into the tree, e.g. [1, 10]
  var view = 'menu';    // 'menu' | 'qr' | 'log'
  var current = null;   // the leaflet being shown
  var lang = '';        // '' means English; otherwise the language being shown
  var shown = [];       // leaflets shown; loaded from this device during init

  function nodeAt(p) {
    var list = MENU, node = null;
    for (var i = 0; i < p.length; i++) { node = list[p[i]]; list = node.children || []; }
    return node;
  }
  function listAt(p) {
    var list = MENU;
    for (var i = 0; i < p.length; i++) list = list[p[i]].children || [];
    return list;
  }
  function crumbFor(p) {
    var out = [], list = MENU;
    for (var i = 0; i < p.length; i++) { out.push(list[p[i]].label); list = list[p[i]].children || []; }
    return out;
  }
  /* ── Addresses ────────────────────────────────────────────────
     Every screen gets its own web address, e.g.
        ...?leaflet=specific-complications/nerve-damage/after-a-general-anaesthetic
     Two reasons. It makes the phone's back gesture work properly, and it lets
     the usage counter tell one leaflet from another — without it every screen
     looks like the same page and you cannot see what is actually being used.  */

  function slugify(s) {
    return String(s).toLowerCase()
      .replace(/[’']/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  /* Each entry carries a permanent "id". Addresses and usage counting are
     built from ids, never from the label, so renaming a leaflet does not
     change its address or split its usage history in the statistics.
     Entries written before ids existed fall back to their label. */
  function idOf(node) {
    return (node && node.id) ? node.id : slugify(node ? node.label : '');
  }

  function idPathFor(p) {
    var out = [], list = MENU;
    for (var i = 0; i < p.length; i++) {
      out.push(idOf(list[p[i]]));
      list = list[p[i]].children || [];
    }
    return out;
  }

  function urlFor(v, p, cur, lg) {
    var base = location.pathname;
    if (v === 'log') return base + '?view=record';
    var parts = idPathFor(p);
    if (v === 'qr' && cur) parts.push(idOf(cur));
    if (!parts.length) return base;
    var url = base + '?leaflet=' + parts.join('/');
    if (v === 'qr' && lg) url += '&lang=' + encodeURIComponent(lg);
    return url;
  }

  /** Work out which screen a web address refers to. Falls back to the home
      screen if it names something that no longer exists in the menu. */
  function stateFromUrl() {
    var home = { view: 'menu', path: [], current: null, lang: '' };
    if (location.search.indexOf('view=record') !== -1) {
      return { view: 'log', path: [], current: null, lang: '' };
    }
    var m = location.search.match(/[?&]leaflet=([^&]*)/);
    if (!m) return home;

    var lm = location.search.match(/[?&]lang=([^&]*)/);
    var wantLang = lm ? decodeURIComponent(lm[1]) : '';

    var slugs = decodeURIComponent(m[1]).split('/');
    var list = MENU, p = [], node = null;
    for (var i = 0; i < slugs.length; i++) {
      if (!slugs[i]) continue;
      var found = -1;
      for (var j = 0; j < list.length; j++) {
        if (idOf(list[j]) === slugs[i]) { found = j; break; }
      }
      if (found === -1) return home;
      node = list[found];
      p.push(found);
      list = node.children || [];
    }
    if (node && !node.children) {
      // Ignore a language the leaflet does not actually have
      var okLang = (wantLang && translationUrl(node, wantLang)) ? wantLang : '';
      return { view: 'qr', path: p.slice(0, -1), current: node, lang: okLang };
    }
    return { view: 'menu', path: p, current: null, lang: '' };
  }

  /** Move to a screen and record it in the browser's history. */
  function go(v, p, cur, lg) {
    view = v; path = p; current = cur; lang = lg || '';
    try { history.pushState(null, '', urlFor(v, p, cur, lang)); } catch (e) { /* file:// */ }
    countPath(v, p, cur, lang);
    render();
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }

  // ── Rendering ────────────────────────────────────────────────
  function render() {
    clear();
    backEl.hidden = (view === 'menu' && path.length === 0);
    if (view === 'menu') renderMenu();
    else if (view === 'qr') renderQR();
    else if (view === 'log') renderLog();
    window.scrollTo(0, 0);
  }

  function renderMenu() {
    var crumbs = crumbFor(path);
    titleEl.textContent = crumbs.length ? crumbs[crumbs.length - 1] : 'Patient information';
    crumbEl.textContent = crumbs.length > 1 ? crumbs.slice(0, -1).join(' › ') : (crumbs.length ? '' : 'Tap a topic to show a QR code');

    var items = listAt(path);
    var ul = el('ul', 'menu');
    items.forEach(function (item, i) {
      var li = el('li');
      var b = el('button', 'item');
      b.appendChild(el('span', 'label', item.label));
      if (item.children) {
        b.appendChild(el('span', 'chev', '›'));
      } else {
        b.appendChild(el('span', 'kind', 'QR'));
      }
      b.onclick = function () {
        if (item.children) go('menu', path.concat([i]), null);
        else go('qr', path, item);
      };
      li.appendChild(b);
      ul.appendChild(li);
    });
    app.appendChild(ul);

    if (path.length === 0) app.appendChild(homeFooter());
  }

  function homeFooter() {
    var f = el('div', 'foot');
    var row = el('div', 'btnrow');

    var logBtn = el('button', 'act', 'Record of leaflets shown' + (shown.length ? ' (' + shown.length + ')' : ''));
    logBtn.onclick = function () { go('log', [], null); };
    row.appendChild(logBtn);

    var fb = el('button', 'act primary', 'Suggest an improvement');
    fb.onclick = function () { openFeedback(''); };
    row.appendChild(fb);

    f.appendChild(row);
    f.appendChild(el('p', null,
      'Broken link? A leaflet we should add, drop or rename? Say so. This menu is maintained centrally, ' +
      'so a suggestion improves it for everyone rather than just your own copy.'));
    f.appendChild(el('p', null,
      'Links open on the patient’s own phone. No patient details are held anywhere in this app. The record of leaflets shown is kept on your own device; only which leaflets get opened is counted.'));
    return f;
  }

  /** Build the feedback link, optionally pre-filling which menu item it concerns. */
  function feedbackUrl(topic) {
    var base = (CONFIG.feedbackFormUrl || '').trim();
    if (!base) return '';
    var param = (CONFIG.feedbackTopicParam || '').trim();
    if (!param || !topic) return base;
    return base + (base.indexOf('?') === -1 ? '?' : '&') +
           encodeURIComponent(param) + '=' + encodeURIComponent(topic);
  }

  function openFeedback(topic) {
    var u = feedbackUrl(topic);
    if (u) { window.open(u, '_blank', 'noopener'); return; }
    alert('No feedback form has been set up yet.\n\n' +
          'Paste your Microsoft Form link into "feedbackFormUrl" near the top of this file, ' +
          'then re-upload it. Everyone will pick the change up automatically.');
  }

  function renderQR() {
    var langs   = languagesFor(current);
    var showUrl = lang ? translationUrl(current, lang) : current.url;

    titleEl.textContent = 'Ask the patient to scan';
    crumbEl.textContent = crumbFor(path).join(' › ');

    var wrap = el('div', 'qrwrap');
    wrap.appendChild(el('div', 'qrtitle', current.label));
    if (lang) {
      var badge = el('p', 'langnow');
      badge.appendChild(el('span', 'langpill', lang));
      badge.appendChild(document.createTextNode(' translation — a PDF from the RCoA'));
      wrap.appendChild(badge);
    }
    wrap.appendChild(el('p', 'qrhint', 'Hold the screen towards the patient. They scan with their phone camera.'));

    var card = el('div', 'qrcard');
    var canvas = document.createElement('canvas');
    card.appendChild(canvas);
    wrap.appendChild(card);

    try {
      QR.draw(canvas, showUrl, { px: 340, ecl: 'M' });
      record(current.label + (lang ? ' (' + lang + ')' : ''));
    } catch (err) {
      card.removeChild(canvas);
      var bad = el('div', 'note');
      bad.appendChild(el('strong', null, 'Could not make a QR code'));
      bad.appendChild(document.createTextNode(String(err.message || err)));
      wrap.appendChild(bad);
    }

    var url = el('div', 'urltext', showUrl);
    wrap.appendChild(url);

    var row = el('div', 'btnrow');
    var copy = el('button', 'act', 'Copy link');
    copy.onclick = function () { copyText(showUrl, copy, 'Copy link'); };
    row.appendChild(copy);

    var open = el('a', 'act', 'Open it myself');
    open.href = showUrl; open.target = '_blank'; open.rel = 'noopener noreferrer';
    row.appendChild(open);

    var sug = el('button', 'act', 'Suggest a change');
    sug.onclick = function () {
      openFeedback(crumbFor(path).concat([current.label]).join(' > '));
    };
    row.appendChild(sug);
    wrap.appendChild(row);

    // ── Other languages ───────────────────────────────────────
    if (langs.length) {
      var box = el('div', 'langbox');
      box.appendChild(el('h2', 'langhead', 'Other languages'));
      box.appendChild(el('p', 'langsub',
        'Tap a language to show that version instead. ' + langs.length +
        ' available, translated for the RCoA by Translators without Borders.'));

      var list = el('div', 'langlist');

      var eng = el('button', 'lang' + (lang ? '' : ' on'), 'English');
      eng.onclick = function () { if (lang) go('qr', path, current, ''); };
      list.appendChild(eng);

      langs.forEach(function (name) {
        var b = el('button', 'lang' + (lang === name ? ' on' : ''), name);
        b.onclick = function () { go('qr', path, current, name); };
        list.appendChild(b);
      });
      box.appendChild(list);
      wrap.appendChild(box);
    }

    var note = el('div', 'note');
    note.appendChild(el('strong', null, 'A QR code is not enough on its own'));
    note.appendChild(document.createTextNode(
      'Offer a printed leaflet to any patient without a smartphone, with a visual impairment, or who would simply prefer paper. ' +
      'The Accessible Information Standard makes that a requirement, not a courtesy.'));
    wrap.appendChild(note);

    app.appendChild(wrap);
  }

  /* ── The record of leaflets shown ──────────────────────────────
     Kept on this device until you clear it, so a list is not lost when the
     page reloads or the phone closes the app in the background. It holds
     leaflet names, dates and times only — never anything about a patient.
     It stays on this device: nothing is sent anywhere.                     */

  var LOG_KEY = 'leaflet-qr-log-v1';
  var LOG_MAX = 2000;              // generous, but stops unbounded growth
  var logStorageWorks = true;

  function loadLog() {
    try {
      var raw = window.localStorage.getItem(LOG_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Object.prototype.toString.call(parsed) === '[object Array]' ? parsed : [];
    } catch (e) {
      logStorageWorks = false;     // private browsing, or storage turned off
      return [];
    }
  }

  function saveLog() {
    try {
      window.localStorage.setItem(LOG_KEY, JSON.stringify(shown));
    } catch (e) {
      logStorageWorks = false;     // full or unavailable; the list still works for now
    }
  }

  function two(n) { return (n < 10 ? '0' : '') + n; }

  function record(label) {
    var d = new Date();
    var date = d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate());
    var time = two(d.getHours()) + ':' + two(d.getMinutes());
    // Ignore a repeat of the same leaflet within the same minute. Re-renders and
    // stepping back from a translation would otherwise log it twice over.
    for (var i = shown.length - 1; i >= 0 && i > shown.length - 12; i--) {
      var e = shown[i];
      if (e.label === label && e.date === date && e.time === time) return;
    }
    shown.push({ date: date, time: time, label: label });
    if (shown.length > LOG_MAX) shown = shown.slice(shown.length - LOG_MAX);
    saveLog();
  }

  function prettyDate(iso) {
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var diff = Math.round((today - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  function renderLog() {
    titleEl.textContent = 'Record of leaflets shown';
    crumbEl.textContent = shown.length
      ? shown.length + ' entr' + (shown.length === 1 ? 'y' : 'ies') + ' — kept until you clear it'
      : 'Kept on this device until you clear it';

    if (!shown.length) {
      app.appendChild(el('p', 'empty',
        'Nothing shown yet. Leaflets you display will be listed here, with the date and time, so you can copy them into your notes.'));
      app.appendChild(backRow());
      return;
    }

    // Newest day first — that is what you need when writing up
    var byDate = {}, order = [];
    shown.forEach(function (s) {
      var key = s.date || 'undated';
      if (!byDate[key]) { byDate[key] = []; order.push(key); }
      byDate[key].push(s);
    });
    order.sort().reverse();

    order.forEach(function (key) {
      app.appendChild(el('h2', 'logday', key === 'undated' ? 'Earlier' : prettyDate(key)));
      var ul = el('ul', 'log');
      byDate[key].forEach(function (s) {
        var li = el('li');
        li.appendChild(el('span', 't', s.time));
        li.appendChild(el('span', null, s.label));
        ul.appendChild(li);
      });
      app.appendChild(ul);
    });

    var row = el('div', 'btnrow');
    row.style.justifyContent = 'flex-start';

    var copy = el('button', 'act primary', 'Copy for notes');
    copy.onclick = function () {
      var lines = [];
      order.forEach(function (key) {
        lines.push('Patient information discussed — ' + (key === 'undated' ? 'date not recorded' : prettyDate(key)) + ':');
        byDate[key].forEach(function (s) { lines.push('  ' + s.time + '  ' + s.label + ' (RCoA)'); });
        lines.push('');
      });
      copyText(lines.join('\n').trim(), copy, 'Copy for notes');
    };
    row.appendChild(copy);

    var clr = el('button', 'act danger', 'Clear all');
    clr.onclick = function () {
      if (confirm('Clear all ' + shown.length + ' entries?\n\nMake sure anything you still need is in the patient record first. This cannot be undone.')) {
        shown = [];
        saveLog();
        render();
      }
    };
    row.appendChild(clr);
    app.appendChild(row);

    var note = el('div', 'note');
    note.appendChild(el('strong', null, 'This is a memory aid, not the record'));
    note.appendChild(document.createTextNode(
      'It holds leaflet names, dates and times only — never patient details, and never enter any. ' +
      'It is kept on this device until you clear it and is not sent anywhere. ' +
      'Copy it into the patient record yourself: that is what makes it part of the consent documentation, ' +
      'and this list is no substitute for it.'));
    app.appendChild(note);

    if (!logStorageWorks) {
      var warn = el('div', 'note');
      warn.appendChild(el('strong', null, 'This list cannot be saved on this device'));
      warn.appendChild(document.createTextNode(
        'Your browser is refusing to store it — private browsing will do this. ' +
        'The list works for now but will be lost when the page closes, so copy anything you need before then.'));
      app.appendChild(warn);
    }
  }
  function backRow() {
    var row = el('div', 'btnrow');
    row.style.justifyContent = 'flex-start';
    var b = el('button', 'act', 'Back to menu');
    b.onclick = function () { go('menu', [], null); };
    row.appendChild(b);
    return row;
  }

  function copyText(text, btn, original) {
    function done(ok) {
      btn.textContent = ok ? 'Copied' : 'Press and hold to copy';
      setTimeout(function () { btn.textContent = original; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
  }

  // ── Navigation ───────────────────────────────────────────────
  /* The header's Back button just steps the browser back, so it behaves
     identically to the phone's own back gesture rather than fighting it. */
  backEl.onclick = function () {
    if (history.length > 1) { history.back(); return; }
    if (view === 'qr') go('menu', path, null);          // deep-linked straight in
    else if (view === 'log') go('menu', [], null);
    else if (path.length) go('menu', path.slice(0, -1), null);
  };

  window.onpopstate = function () {
    var s = stateFromUrl();
    view = s.view; path = s.path; current = s.current; lang = s.lang || '';
    countPath(view, path, current, lang);
    render();
  };

  /* ── Usage counting (GoatCounter) ──────────────────────────────
     Dormant until goatcounterCode is filled in at the top of this file.
     Counts which leaflets get opened, so unused ones can be spotted.
     Cookieless, and records no patient information — but it is an outside
     service, so nothing loads at all while the setting is empty.

     We tell GoatCounter the path ourselves rather than letting it read the
     address bar, so each leaflet appears as its own tidy line in the
     dashboard instead of a jumble of query strings. */

  var countQueue = [];

  function countPath(v, p, cur, lg) {
    if (!(CONFIG.goatcounterCode || '').trim()) return;
    var path;
    if (v === 'log') {
      path = '/record-of-leaflets-shown';
    } else {
      var parts = idPathFor(p);
      if (v === 'qr' && cur) parts.push(idOf(cur));
      path = '/' + parts.join('/');
      // Translations count under the leaflet, so you can see which languages
      // are actually being asked for without losing the leaflet's own total.
      if (v === 'qr' && lg) path += '/in/' + slugify(lg);
    }
    if (window.goatcounter && typeof window.goatcounter.count === 'function') {
      window.goatcounter.count({ path: path, title: path, event: false });
    } else {
      countQueue.push(path);          // script still loading; send it shortly
    }
  }

  function initAnalytics() {
    var code = (CONFIG.goatcounterCode || '').trim();
    if (!code) return;

    // Setting this before the script loads stops it counting the first view
    // twice — we count every view ourselves, including the first.
    window.goatcounter = { no_onload: true };

    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://' + code + '.goatcounter.com/count');
    s.onload = function () {
      for (var i = 0; i < countQueue.length; i++) {
        try { window.goatcounter.count({ path: countQueue[i], title: countQueue[i], event: false }); }
        catch (e) { /* counting must never break the menu */ }
      }
      countQueue = [];
    };
    document.head.appendChild(s);
  }

  // ── Start ────────────────────────────────────────────────────
  (function init() {
    var s = stateFromUrl();
    view = s.view; path = s.path; current = s.current; lang = s.lang || '';

    // If someone opened a deep link directly, give Back somewhere to go.
    try {
      history.replaceState(null, '', urlFor('menu', [], null, ''));
      if (view !== 'menu' || path.length) {
        history.pushState(null, '', urlFor(view, path, current, lang));
      }
    } catch (e) { /* file:// disallows history changes; harmless */ }

    shown = loadLog();

    initAnalytics();
    countPath(view, path, current, lang);
    render();
  })();
})();
</script>
</body>
</html>
